# RESPALDO de play.alnovix.com (app Flet de PlayBar GO) en Fly.io.
# El principal sigue en Railway (jukebox-flet).
app = "playbar-web-respaldo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.respaldo"

[processes]
  app = "python main.py"

[env]
  ROL_PLAYBAR = "respaldo"
  FLET_FORCE_WEB_SERVER = "true"
  FLET_SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  processes = ["app"]
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
