# RESPALDO de la API de PlayBar GO (Fly.io). El principal sigue en Railway (playbar-api).
# Copia la base del principal cada hora y no revisa pagos (ver services/respaldo.py).
app = "playbar-api-respaldo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.respaldo"

[processes]
  app = "python -m api.servidor"

[env]
  ROL_PLAYBAR = "respaldo"
  PORT = "8080"

[http_service]
  internal_port = 8080
  processes = ["app"]
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/salud"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
